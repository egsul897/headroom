# Initializes a Neon Postgres database from tracked repository code:
# migrations, then the full seed/population sequence, then a verification
# step, then the Coherent + Matthews golden-test harnesses.
#
# workflow_dispatch ONLY - this must never run on push/pull_request/
# deployment. It is a one-time (or deliberately-repeated, by hand)
# initialization action, not part of any CI/CD pipeline.
#
# Replay-safety background: docs/database-replay-safety.md. This workflow
# runs the exact 9-step population sequence validated there against a
# throwaway local database, plus `prisma migrate deploy` first - never
# `migrate dev`, `db push`, or any reset/destructive reseed.
#
# Node version: the repository has no .nvmrc/.node-version and no
# package.json "engines" field. package.json's devDependencies pin
# @types/node to ^20.14.9, indicating Node 20 was the development target -
# Node 20 (a current LTS as of this workflow's authoring) is used below on
# that basis, not from an explicit repository declaration.
#
# NOT EXECUTED as part of authoring this file - no GitHub Actions runner is
# available in the environment that wrote it. Every command below was run,
# individually, either against the real sandbox database or against a
# throwaway local database created and dropped for that purpose
# (docs/database-replay-safety.md §F/§G) - this file's YAML syntax was
# validated, but the workflow itself has not been executed end-to-end.

name: Initialize Neon database

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Guard - DATABASE_URL must be a real, non-local target
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::NEON_DATABASE_URL secret is not set. Refusing to proceed."
            exit 1
          fi
          case "$DATABASE_URL" in
            *localhost*)
              echo "::error::DATABASE_URL contains 'localhost'. Refusing to run migrations/population against what looks like a local database."
              exit 1
              ;;
            *127.0.0.1*)
              echo "::error::DATABASE_URL contains '127.0.0.1'. Refusing to run migrations/population against what looks like a local database."
              exit 1
              ;;
          esac
          echo "DATABASE_URL guard passed (value not printed)."

      - name: Apply migrations (prisma migrate deploy - never dev/push/reset)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx prisma migrate deploy

      # --- Population sequence, exact order validated in
      # docs/database-replay-safety.md §F against a throwaway local database.
      - name: Seed Coherent base data
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx prisma/seed.ts

      - name: Populate Coherent solver-native model
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/populate-coherent-solver-native.ts

      - name: Populate Coherent EBITDA provenance
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/populate-coherent-ebitda-provenance.ts

      - name: Populate Matthews solver-native model
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/populate-matthews-solver-native.ts

      - name: Populate Matthews financial-core + golden questions
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/populate-matthews-financial-provenance.ts

      - name: Populate Coherent legal-review provenance (2026-08-25 closeout)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/populate-coherent-legal-review-provenance.ts

      - name: Populate founder-solo legal review (2026-08-25)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/populate-founder-solo-legal-review-2026-08-25.ts

      - name: Apply Gate-0 security-scope fix
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/populate-coherent-security-scope-fix.ts

      - name: Gate-0 golden-row reconciliation
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/populate-gate0-golden-reconciliation.ts

      - name: Finalize founder-sole review as VERIFIED (2026-08-25 policy)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/finalize-founder-sole-review-verified-2026-08-25.ts

      - name: Populate Coherent financial core
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/populate-coherent-financial-core.ts

      - name: Verify expected state (fails loudly on any mismatch)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/verify-neon-initialization.ts

      # scripts/golden-test.ts itself exits non-zero whenever any row FAILs,
      # which is the current, documented, expected state for both companies
      # (docs/database-replay-safety.md §13) - it is deliberately NOT called
      # directly as a step here. scripts/verify-golden-baseline.ts runs it,
      # reports the full pass/fail/flagged/errored counts as workflow
      # output/logs, and fails the job only if those counts differ from the
      # established baseline - never merely because some rows are
      # known-FAIL/flagged.
      - name: Run Coherent golden-test harness (baseline-checked)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/verify-golden-baseline.ts coherent

      - name: Run Matthews golden-test harness (baseline-checked)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: npx tsx scripts/verify-golden-baseline.ts matthews
