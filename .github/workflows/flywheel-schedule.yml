name: flywheel-schedule

# Standalone Headroom flywheel — no Cursor/Grok/box in the loop.
# Bounded slice via the deployed Vercel cron route (or direct HTTPS to the preview/prod URL).
on:
  schedule:
    # Every 2 hours (Vercel cron covers */15; this is a backup / off-Vercel path)
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      slice:
        description: "Optional forced slice (EDGAR_EXPAND|PRECEDENT_IMPORT|SWEEP_SOURCES|SWEEP_PROPOSALS)"
        required: false
        default: ""

concurrency:
  group: flywheel-schedule
  cancel-in-progress: false

jobs:
  slice:
    name: flywheel slice
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke flywheel cron route
        env:
          FLYWHEEL_CRON_URL: ${{ secrets.FLYWHEEL_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SLICE: ${{ github.event.inputs.slice }}
        run: |
          set -euo pipefail
          if [ -z "${FLYWHEEL_CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "FLYWHEEL_CRON_URL or CRON_SECRET secret unset — skip (fail closed, non-fatal for forks)"
            exit 0
          fi
          url="${FLYWHEEL_CRON_URL}"
          if [ -n "${SLICE:-}" ]; then
            sep=$([[ "$url" == *\?* ]] && echo "&" || echo "?")
            url="${url}${sep}slice=${SLICE}"
          fi
          code=$(curl -sS -o /tmp/flywheel-out.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "$url")
          echo "HTTP ${code}"
          head -c 4000 /tmp/flywheel-out.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "flywheel cron failed"
            exit 1
          fi
