name: stratified-cert-soft-gate

# Soft-gate present-check only.
# IMPLEMENTED ≠ CERTIFIED. PINNED_OFFLINE ≠ CERTIFIED.
# This job proves `npx vitest run tests/stratified-cert` ran when the offline pin
# packet, its tests, or this workflow changed. A green check is not a certified
# path, not a FINANCIAL_TEST eligible:true claim, and not merge authorization.
# Do not fold this into canonical-compiler.yml; that workflow's Phase-3 filters
# stay limited to the certified compiler path.

on:
  push:
    branches: ["**"]
    paths:
      - "tests/stratified-cert/**"
      - "docs/phase-3-reliability-stratified-certification/**"
      - ".github/workflows/stratified-cert-soft-gate.yml"
  pull_request:
    paths:
      - "tests/stratified-cert/**"
      - "docs/phase-3-reliability-stratified-certification/**"
      - ".github/workflows/stratified-cert-soft-gate.yml"

concurrency:
  group: stratified-cert-soft-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stratified-cert:
    name: stratified-cert (soft-gate present-check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # deliberately unset: this soft gate is offline. A provider call from CI is a defect.
      AI_GATEWAY_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      SEMANTIC_INVENTORY_MODE: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: stratified-cert offline pins (fail-closed)
        run: npx vitest run tests/stratified-cert
